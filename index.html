<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABCDEチェッカー</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C7A51">

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-4 max-w-md mx-auto">

<h1 class="text-xl font-bold mb-4">ABCDEチェッカー</h1>

<div id="result" class="p-4 mb-4 rounded-lg text-white text-center font-bold bg-gray-400">
未評価
</div>

<section class="mb-4">
<h2 class="font-bold">A 気道</h2>
<select id="a" class="w-full p-2 border">
<option value="">選択</option>
<option value="正常">正常</option>
<option value="注意">いびき様・分泌物</option>
<option value="緊急">閉塞疑い</option>
</select>
</section>

<section class="mb-4">
<h2 class="font-bold">B 呼吸</h2>
<input type="number" id="rr" placeholder="呼吸数 /分" class="w-full p-2 border mb-2">
<input type="number" id="spo2" placeholder="SpO2 %" class="w-full p-2 border">
</section>

<section class="mb-4">
<h2 class="font-bold">C 循環</h2>
<input type="number" id="pulse" placeholder="脈拍" class="w-full p-2 border mb-2">
<select id="skin" class="w-full p-2 border">
<option value="">皮膚状態</option>
<option>正常</option>
<option>蒼白</option>
<option>冷感</option>
<option>発汗</option>
</select>
</section>

<section class="mb-4">
<h2 class="font-bold">D 意識（AVPU）</h2>
<select id="d" class="w-full p-2 border">
<option value="">選択</option>
<option value="正常">A 清明</option>
<option value="注意">V 呼びかけ反応</option>
<option value="緊急">P/U 反応低下</option>
</select>
</section>

<section class="mb-4">
<h2 class="font-bold">E 体温・外傷</h2>
<input type="number" id="temp" placeholder="体温" class="w-full p-2 border mb-2">
<select id="bleed" class="w-full p-2 border">
<option value="">出血</option>
<option value="正常">なし</option>
<option value="注意">軽度</option>
<option value="緊急">大量</option>
</select>
</section>

<button id="btn-evaluate" class="bg-blue-600 text-white w-full p-3 rounded mb-2">
評価する
</button>

<button onclick="download()" class="bg-green-600 text-white w-full p-3 rounded">
ダウンロード
</button>

<script>

// 安全に値を取得する関数
function val(id){
  const el = document.getElementById(id);
  return el ? el.value : "";
}

// 判定
function evaluate(){

let level = "正常";

const a = val("a");
const rr = Number(val("rr"));
const spo2 = Number(val("spo2"));
const pulse = Number(val("pulse"));
const skin = val("skin");
const d = val("d");
const bleed = val("bleed");

// A
if(a === "緊急") level = "緊急";
else if(a === "注意" && level !== "緊急") level = "注意";

// B
if(val("rr") !== "" && (rr < 10 || rr > 24)) level = "緊急";
if(val("spo2") !== "" && spo2 < 92) level = "緊急";

// C
if(val("pulse") !== "" && (pulse > 120 || pulse < 50)) level = "緊急";
if(["蒼白","冷感","発汗"].includes(skin) && level !== "緊急") level = "注意";

// D
if(d === "緊急") level = "緊急";
else if(d === "注意" && level !== "緊急") level = "注意";

// E
if(bleed === "緊急") level = "緊急";
else if(bleed === "注意" && level !== "緊急") level = "注意";

// 表示
const result = document.getElementById("result");

// ★現在日時を取得してフォーマットする（YYYY/MM/DD HH:MM:SS）
const now = new Date();
const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

if(level === "緊急"){
result.innerHTML = `緊急対応<br><span class="text-xs font-normal">評価日時: ${timeStr}</span>`;
result.className = "p-4 mb-4 rounded-lg text-white text-center font-bold bg-red-600";
// 119ボタンを表示（既存なら更新しない）
let callBtn = document.getElementById("btn-119");
if(!callBtn){
  callBtn = document.createElement("a");
  callBtn.id = "btn-119";
  callBtn.href = "tel:119";
  callBtn.className = "block bg-red-700 text-white w-full p-4 rounded mb-2 text-center text-lg font-bold tracking-widest animate-pulse";
  callBtn.textContent = "📞 119に発信";
  document.getElementById("btn-evaluate").insertAdjacentElement("afterend", callBtn);
}
callBtn.style.display = "block";
}
else if(level === "注意"){
result.innerHTML = `要観察<br><span class="text-xs font-normal">評価日時: ${timeStr}</span>`;
result.className = "p-4 mb-4 rounded-lg text-white text-center font-bold bg-yellow-500";
const callBtn = document.getElementById("btn-119");
if(callBtn) callBtn.style.display = "none";
}
else{
result.innerHTML = `安定<br><span class="text-xs font-normal">評価日時: ${timeStr}</span>`;
result.className = "p-4 mb-4 rounded-lg text-white text-center font-bold bg-green-600";
const callBtn = document.getElementById("btn-119");
if(callBtn) callBtn.style.display = "none";
}
}

// ダウンロード
function download(){

// ダウンロード時にその瞬間の時間を取得する
const now = new Date();
const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

const text = `
【ABCDE評価】
評価日時: ${timeStr}
A: ${val("a")}
B: RR=${val("rr")} SpO2=${val("spo2")}
C: Pulse=${val("pulse")} Skin=${val("skin")}
D: ${val("d")}
E: Temp=${val("temp")} Bleed=${val("bleed")}
`;

const blob = new Blob([text], {type: "text/plain"});
const url = URL.createObjectURL(blob);

const aTag = document.createElement("a");
aTag.href = url;
aTag.download = `abcde_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.txt`; // ファイル名にも日付が入るようにしました
aTag.click();
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

// ★ クリックイベントの登録
document.getElementById("btn-evaluate").addEventListener("click", evaluate);

</script>
          
</body>
</html>
